<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISDL Website Prototypes</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            flex-direction: column;
            color: #333;
        }
        h1 {
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 40px;
            color: #555;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        a.button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 100px;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            background-color: #007bff;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        a.button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        a.button.wip {
            background-color: #6c757d;
            cursor: pointer; /* Keep pointer to indicate it's clickable */
        }
        .status {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>ISDL 웹사이트 프로토타입</h1>
    <p>아래 버튼을 클릭하여 각 디자인 타입의 프로토타입을 확인하세요.</p>
    <div class="container">
        <!-- <a href="type0/index.html" class="button">
            <span>Type 0</span>
        </a> -->
        <a href="type1/index.html" class="button">
            <span>Type 1</span>
        </a>
        <a href="type2/index.html" class="button wip">
            <span>Type 2</span>
        </a>
        <a href="type3/index.html" class="button wip">
            <span>Type 3</span>
        </a>
    </div>
</body>
</html>
